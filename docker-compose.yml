services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ielts_scorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts_scorer}
      POSTGRES_DB: ${POSTGRES_DB:-ielts_scorer_db}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  languagetool:
    image: erikvl87/languagetool
    ports: ["8010:8010"]
volumes: { pgdata: {} }
